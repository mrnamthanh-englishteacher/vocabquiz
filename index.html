<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{
  text-align:center;
  color:#c00000;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG  ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
 {
    q: "The government's decision to raise fuel taxes during an economic crisis could ______ public dissatisfaction and lead to widespread protests.",
    a: ["alleviate", "exacerbate", "compensate", "curate"],
    c: 1
  },
  {
    q: "The new scholarship programme aims to ______ the financial difficulties faced by students from low-income families.",
    a: ["alleviate", "escalate", "augment", "trigger"],
    c: 0
  },
  {
    q: "The company plans to ______ its operations into several Asian markets after achieving strong domestic sales.",
    a: ["diminish", "displace", "expand", "diagnose"],
    c: 2
  },
  {
    q: "The sudden announcement of mass layoffs is likely to ______ anxiety among employees who are already worried about job security.",
    a: ["prescribe", "accumulate", "compensate", "trigger"],
    c: 3
  },
  {
    q: "The scientist's discovery helped ______ the importance of protecting biodiversity in tropical forests.",
    a: ["fluctuate", "underscore", "displace", "diminish"],
    c: 1
  },
  {
    q: "Despite years of research, a permanent cure for this rare genetic disease remains ______.",
    a: ["prominent", "consistent", "elusive", "spontaneous"],
    c: 2
  },
  {
    q: "Without adequate investment in public transport, traffic congestion may continue to ______ as more people purchase private cars.",
    a: ["escalate", "alleviate", "compensate", "curate"],
    c: 0
  },
  {
    q: "The museum hired experienced historians to ______ a collection of photographs for its upcoming exhibition.",
    a: ["diagnose", "augment", "displace", "curate"],
    c: 3
  },
  {
    q: "Regular exercise can ______ the risk of developing several chronic diseases, including heart disease and type 2 diabetes.",
    a: ["engender", "diminish", "escalate", "accumulate"],
    c: 1
  },
  {
    q: "The rapid ______ of artificial intelligence has raised important questions about the future of employment.",
    a: ["detachment", "prescription", "emergence", "proximity"],
    c: 2
  },
  {
    q: "The factory has decided to ______ additional workers to its overseas branch to meet rising production demands.",
    a: ["deploy", "curate", "diagnose", "prescribe"],
    c: 0
  },
  {
    q: "To make an accurate ______, doctors must carefully examine the patient's symptoms and medical history.",
    a: ["implementation", "accommodation", "compensation", "diagnosis"],
    c: 3
  },
  {
    q: "The patient's condition became so ______ that doctors transferred him to the intensive care unit for immediate treatment.",
    a: ["intimate", "acute", "complementary", "superficial"],
    c: 1
  },
  {
    q: "The city council introduced stricter building regulations to prevent ______ in the quality of newly constructed apartments.",
    a: ["augmentation", "proximity", "anomalies", "gains"],
    c: 2
  },
  {
    q: "Unlike his colleagues, who frequently changed their opinions, the professor remained remarkably ______ in his position throughout the debate.",
    a: ["consistent", "elusive", "spontaneous", "mortal"],
    c: 0
  },
  {
    q: "The company's new software uses ______ algorithms capable of detecting extremely subtle patterns in large datasets.",
    a: ["superficial", "mortal", "intimate", "sophisticated"],
    c: 3
  },
  {
    q: "The construction company was required to ______ residents whose homes had been damaged by its operations.",
    a: ["integrate", "compensate", "intensify", "originate"],
    c: 1
  },
  {
    q: "Online retailers often ______ advanced data analytics to predict customer behaviour and improve sales.",
    a: ["fluctuate", "diminish", "deploy", "displace"],
    c: 2
  },
  {
    q: "The government's efforts to ______ the transition to renewable energy include tax incentives and financial support for green businesses.",
    a: ["accelerate", "determine", "displace", "diagnose"],
    c: 0
  },
  {
    q: "Several economic indicators suggest that consumer confidence may ______ in response to unexpected changes in interest rates.",
    a: ["curate", "originate", "engender", "fluctuate"],
    c: 3
  },
  {
    q: "The researchers found that children living in close ______ to major highways were exposed to higher levels of air pollution.",
    a: ["emergence", "proximity", "detachment", "implementation"],
    c: 1
  },
  {
    q: "The government introduced a detailed plan to ensure the effective ______ of the new environmental protection law.",
    a: ["implementation", "accommodation", "prescription", "detachment"],
    c: 0
  },
  {
    q: "The rapid growth of automation could ______ thousands of factory workers if companies fail to provide retraining opportunities.",
    a: ["integrate", "augment", "displace", "appoint"],
    c: 2
  },
  {
    q: "The doctor decided to ______ a course of antibiotics after laboratory tests confirmed a bacterial infection.",
    a: ["curate", "deploy", "augment", "prescribe"],
    c: 3
  },
  {
    q: "The organisation decided to ______ its existing workforce with temporary staff during the busiest months of the year.",
    a: ["diminish", "augment", "diagnose", "originate"],
    c: 1
  },
  {
    q: "Although the two politicians disagreed on many issues, they found that their economic proposals were largely ______ rather than contradictory.",
    a: ["complementary", "mortal", "elusive", "spontaneous"],
    c: 0
  },
  {
    q: "Many of the traditional farming methods used in this region can be ______ to agricultural practices developed several centuries ago.",
    a: ["engaged in", "compensated for", "traced back", "diagnosed with"],
    c: 2
  },
  {
    q: "The professor explained that several psychological problems may ______ prolonged exposure to stressful working environments.",
    a: ["stem from", "engage in", "compensate for", "integrate into"],
    c: 0
  },
  {
    q: "The committee will evaluate all applications ______ the applicants' nationality, gender, or financial background.",
    a: ["derived from", "rooted in", "integrated into", "regardless of"],
    c: 3
  },
  {
    q: "The hospital director has decided to ______ a highly experienced surgeon to lead the newly established department.",
    a: ["aggravate", "appoint", "accumulate", "fluctuate"],
    c: 1
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
